<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1425">
<title>Delivery Rush — Entregas rápidas</title>
<style>
:root{--bg:#081326;--panel:#17263d;--line:#58718e;--green:#08d477;--cyan:#08c9e8;--gold:#ffc928}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f;color:#f4f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;user-select:none}
body{display:flex;justify-content:center;align-items:stretch;background:radial-gradient(ellipse at 50% 35%,#172b46,#07101f 75%)}
#app{width:min(100vw,480px);height:100dvh;min-height:550px;display:flex;flex-direction:column;padding:7px 8px max(8px,env(safe-area-inset-bottom));gap:6px}
.top{display:grid;grid-template-columns:1.12fr 1.55fr .45fr;gap:6px;flex:0 0 auto}
.panel{background:linear-gradient(145deg,#20334e,#101d32);border:2px solid #526b88;border-radius:15px;box-shadow:inset 0 1px 0 #ffffff26,0 4px 12px #0008;padding:7px 9px;min-width:0}
.profile{display:grid;grid-template-columns:43px 1fr;gap:8px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;color:#e43b40;font-weight:1000;font-style:italic;font-size:10px}
.name{font-weight:900;color:#35e59b;font-size:16px;line-height:1.1}
.order{font-size:13px;color:#d7e2f3}
.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;margin-top:2px}
.money{color:#ffd22d}.diamonds{color:#42b8ff}.energy{color:#ffce27}
.mission{display:flex;align-items:center;gap:9px}
.missionIcon{font-size:26px;color:#9fc7ed}
.mission small{display:block;color:#48d7f0;font-weight:900;font-size:13px}
.mission strong{display:block;color:#ff7e88;font-size:12px}
.mission span{font-size:12px;color:#e5edf8;line-height:1.2}
.timer{text-align:center;display:flex;flex-direction:column;justify-content:center;color:#5eafff;font-size:22px;font-weight:900}
.timer small{font-size:19px}
#mapWrap{position:relative;flex:1;min-height:0;border:2px solid #30445e;border-radius:17px;overflow:hidden;background:#101b2b;box-shadow:0 8px 20px #0008}
#staticMap,#dynamicMap{position:absolute;inset:0;width:100%;height:100%;display:block}
#dynamicMap{touch-action:pan-y}
#rotateHint{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#e9f3ff;background:#071525c9;border:1px solid #8aa6c7;border-radius:20px;padding:3px 8px;pointer-events:none;white-space:nowrap}
.status{flex:0 0 auto;text-align:center;color:#aabbd0;font-size:13px;min-height:20px}
.controls{display:grid;grid-template-columns:.75fr 1.45fr .9fr;gap:8px;align-items:center;flex:0 0 auto}
.speed{height:66px;border-radius:15px;border:2px solid #536d8c;background:#101e32;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.speed:before{content:"";position:absolute;inset:5px 7px 17px;border-radius:100px 100px 8px 8px;border:5px solid transparent;border-top-color:#28df8c;border-left-color:#ffc52e;border-right-color:#ff5252}
.speed label{font-size:10px;color:#b7c9dd;z-index:1;font-weight:800}.speed b{font-size:25px;line-height:1.1;z-index:1}
#deliver{height:68px;border:0;border-radius:17px;background:linear-gradient(180deg,#0acb86,#009c68);box-shadow:0 5px 0 #006d51,0 7px 14px #0007;color:white;font-size:clamp(18px,5vw,25px);font-weight:1000;letter-spacing:.3px}
#deliver:active{transform:translateY(3px);box-shadow:0 2px 0 #006d51}
#deliver:disabled{opacity:.55}
.music{height:66px;border:2px solid #526b88;border-radius:14px;background:#14243a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#c8d8eb;font-size:12px}
.music div{display:flex;gap:9px;font-size:20px;color:#ffb32e}
.bottom{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:0 0 auto;padding-top:4px}
.tool{aspect-ratio:1/1;max-height:58px;border:2px solid #04bfe9;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);background:linear-gradient(145deg,#243e5d,#101d32);color:#fff;font-size:23px;display:grid;place-items:center;filter:drop-shadow(0 0 4px #00c9ff)}
.tool:active{transform:scale(.94)}
#toast{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#071525ed;border:1px solid #6d8eae;border-radius:20px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:4}
#toast.show{opacity:1}
#stars{font-size:14px;color:#ffcf36}
@media(max-height:650px){#app{gap:4px;padding-top:4px}.panel{padding:5px 7px}.controls .speed,.music{height:54px}#deliver{height:56px}.tool{max-height:48px}.status{font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <section class="panel profile">
      <div class="logo">Royal<br>Rush</div>
      <div>
        <div class="name">🏍️ Fer</div>
        <div class="order">Pedido <b id="orderNo">4</b>/100</div>
        <div class="stats"><span class="money">💰 <b id="cash">$283</b></span><span class="diamonds">💎 <b id="gems">0</b></span><span>🏙️ <b id="buildings">0</b></span><span class="energy">⚡ <b id="energy">1</b></span></div>
      </div>
    </section>
    <section class="panel mission">
      <div class="missionIcon">⚙️<small>MISIÓN</small></div>
      <div><strong>OBLIGATORIO: ⚡</strong><span id="missionText">Usa una Ayuda del Tablero</span></div>
    </section>
    <section class="panel timer"><small>⏱️</small><b id="timer">40</b></section>
  </header>

  <main id="mapWrap" aria-label="Mapa de la ciudad">
    <canvas id="staticMap"></canvas>
    <canvas id="dynamicMap"></canvas>
    <div id="rotateHint">Toca una calle para girarla ↻</div>
    <div id="toast"></div>
  </main>
  <div class="status">📦 Pedido #<b id="orderLabel">4</b> | 👆 <span id="statusText">Gira las calles para preparar la ruta</span> <span id="stars"></span></div>
  <section class="controls">
    <div class="speed"><label>KM/H</label><b id="speed">0</b></div>
    <button id="deliver">📦 ENTREGAR</button>
    <div class="music"><span>♫ Música</span><div><span>📂</span><span>▶️</span><span>⏭️</span></div></div>
  </section>
  <nav class="bottom">
    <button class="tool" title="Ayuda" id="help">⚡</button>
    <button class="tool" title="Tiempo">⏱️</button>
    <button class="tool" title="Ciudad">🏙️</button>
    <button class="tool" title="Sonido">🔊</button>
    <button class="tool" title="Tienda">🛍️</button>
    <button class="tool" title="Colección">🖼️</button>
    <button class="tool" title="Menú" id="menu">☰</button>
  </nav>
</div>
<script>
(()=> {
"use strict";
const COLS=6, ROWS=7, DPR=2;
const staticCanvas=document.getElementById("staticMap"), mapCanvas=document.getElementById("dynamicMap");
const sctx=staticCanvas.getContext("2d"), ctx=mapCanvas.getContext("2d");
const $=id=>document.getElementById(id);
const assets={};
const assetNames=["road_straight","road_curve","road_t","road_cross","factory","cafeteria","playground","motorcycle","car","coin"];
let loaded=0;
assetNames.forEach(n=>{const im=new Image();im.src="assets/"+n+".png";im.onload=()=>{loaded++;if(loaded===assetNames.length)drawStatic()};assets[n]=im;});
let W=0,H=0,tile=0,ox=0,oy=0,anim=null,coins=[],route=[],carPositions=[],timer=40;
const saved=JSON.parse(localStorage.getItem("deliveryRushV2")||"{}");
let cash=saved.cash??283,gems=saved.gems??0,order=saved.order??4,energy=saved.energy??1,delivered=saved.delivered??0;
$("cash").textContent="$"+cash;$("gems").textContent=gems;$("orderNo").textContent=order;$("orderLabel").textContent=order;$("energy").textContent=energy;$("buildings").textContent=delivered;
const N=1,E=2,S=4,WEST=8;
const rotateMask=m=>((m<<1)&15)|(m>>3);
const tileMap=[
 // type, rotation, road, coin
 ["block",0,false,0],["road",1,true,1],["block",0,false,0],["road",1,true,1],["block",0,false,0],["road",1,true,1],
 ["road",0,true,1],["road",1,true,0],["road",0,true,1],["block",0,false,0],["road",0,true,0],["road",0,true,1],
 ["block",0,false,0],["road",1,true,1],["block",0,false,0],["road",1,true,0],["block",0,false,0],["road",0,true,1],
 ["start",0,true,0],["road",1,true,1],["road",0,true,1],["road",1,true,1],["road",0,true,1],["road",1,true,1],
 ["block",0,false,0],["block",0,false,0],["play",0,false,0],["road",0,true,0],["block",0,false,0],["road",0,true,0],
 ["road",0,true,1],["road",1,true,1],["road",0,true,1],["block",0,false,0],["road",1,true,1],["dest",0,true,0],
 ["road",0,true,1],["block",0,false,0],["road",0,true,1],["road",1,true,1],["block",0,false,0],["road",0,true,1]
];
// Default connections: designed route from left-middle to bottom-right, with a few rotatable junctions.
const masks=[
 0,NS(),0,NS(),0,NS(),
 EW(),NESW(),EW(),0,NS(),NS(),
 0,EW(),0,NS(),0,NS(),
 EW(), EW(), EW(), EW(), EW(), S|WEST,
 0,0,0,NS(),0,0,
 0,0,0,NS(),0,N|S,
 NS(),EW(),NS(),0,NS(),N|S,
 NS(),0,NS(),EW(),0,NS()
];
function NS(){return N|S} function EW(){return E|WEST} function NESW(){return N|E|S|WEST}
let cells=tileMap.map((v,i)=>({type:v[0],rotation:v[1],isRoad:v[2],coin:!!v[3],mask:masks[i]||0,coinTaken:false}));
const start=3*COLS, dest=5*COLS+5;
// Start/destination anchors
cells[start].type="start";cells[start].isRoad=true;cells[start].mask=E;
cells[dest].type="dest";cells[dest].isRoad=true;cells[dest].mask=N|S;
// add initial puzzle break: rotate one horizontal road away from the route
cells[3*COLS+2].rotation=1; cells[3*COLS+2].mask=NS();
coins=cells.map((c,i)=>c.coin?i:-1).filter(i=>i>=0);
function save(){localStorage.setItem("deliveryRushV2",JSON.stringify({cash,gems,order,energy,delivered}));}
function showToast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove("show"),1700)}
function resize(){
 const r=$("mapWrap").getBoundingClientRect();W=r.width;H=r.height;
 tile=Math.min(W/COLS,H/ROWS);ox=(W-tile*COLS)/2;oy=(H-tile*ROWS)/2;
 [staticCanvas,mapCanvas].forEach(c=>{c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+"px";c.style.height=H+"px"});
 sctx.setTransform(DPR,0,0,DPR,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
 drawStatic();drawDynamic();
}
function drawRoad(ctx,x,y,mask,rotation=0){
 const cx=x+tile/2,cy=y+tile/2,w=tile*.54;
 ctx.fillStyle="#bfc5c4";ctx.fillRect(x,y,tile,tile);
 ctx.fillStyle="#7e8a88";ctx.fillRect(x+1,y+1,tile-2,tile-2);
 ctx.fillStyle="#30383b";ctx.fillRect(x+tile*.22,y+tile*.02,tile*.56,tile*.96);
 ctx.fillStyle="#e3e1d5";ctx.fillRect(x+tile*.18,y+tile*.02,tile*.04,tile*.96);ctx.fillRect(x+tile*.78,y+tile*.02,tile*.04,tile*.96);
 ctx.fillStyle="#f7cb38";ctx.setLineDash([tile*.12,tile*.1]);ctx.lineWidth=Math.max(1,tile*.035);
 ctx.beginPath();ctx.moveTo(cx,y+tile*.05);ctx.lineTo(cx,y+tile*.95);ctx.stroke();ctx.setLineDash([]);
 // crosswalks near road exits
 ctx.fillStyle="#f1f2eb";
 if(mask&N)for(let i=0;i<5;i++)ctx.fillRect(x+tile*.27+i*tile*.1,y+tile*.04,tile*.055,tile*.12);
 if(mask&S)for(let i=0;i<5;i++)ctx.fillRect(x+tile*.27+i*tile*.1,y+tile*.84,tile*.055,tile*.12);
 if(mask&E)for(let i=0;i<5;i++)ctx.fillRect(x+tile*.84,y+tile*.27+i*tile*.1,tile*.12,tile*.055);
 if(mask&WEST)for(let i=0;i<5;i++)ctx.fillRect(x+tile*.04,y+tile*.27+i*tile*.1,tile*.12,tile*.055);
 // side streets overlay to create true junction topology
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation*Math.PI/2);ctx.translate(-cx,-cy);
 ctx.fillStyle="#30383b";
 if(mask&E||mask&WEST)ctx.fillRect(x+tile*.02,y+tile*.23,tile*.96,tile*.54);
 ctx.fillStyle="#f7cb38";ctx.setLineDash([tile*.12,tile*.1]);ctx.lineWidth=Math.max(1,tile*.035);
 if(mask&E||mask&WEST){ctx.beginPath();ctx.moveTo(x+tile*.05,cy);ctx.lineTo(x+tile*.95,cy);ctx.stroke()}
 ctx.setLineDash([]);ctx.restore();
}
function drawBlock(ctx,x,y,type){
 ctx.fillStyle="#b9b4a6";ctx.fillRect(x,y,tile,tile);
 ctx.fillStyle="#d8d1bf";ctx.fillRect(x+2,y+2,tile-4,tile-4);
 ctx.fillStyle="#6b8b65";ctx.fillRect(x+tile*.04,y+tile*.04,tile*.92,tile*.92);
 const im=assets[type==="factory"?"factory":type==="cafe"?"cafeteria":"playground"];
 if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x+tile*.04,y+tile*.04,tile*.92,tile*.92);
 else {ctx.fillStyle=type==="factory"?"#2477a9":type==="cafe"?"#a65d35":"#e5a12a";ctx.fillRect(x+tile*.2,y+tile*.2,tile*.6,tile*.6)}
}
function drawStatic(){
 if(!W||!H)return;
 sctx.clearRect(0,0,W,H);
 sctx.fillStyle="#52624e";sctx.fillRect(0,0,W,H);
 // textured grass base
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const i=r*COLS+c,cell=cells[i],x=ox+c*tile,y=oy+r*tile;
  if(cell.isRoad){drawRoad(sctx,x,y,cell.mask,cell.rotation)}
  else {let type="factory";if(i===2*COLS+2)type="cafe";if(i===4*COLS+2||i===4*COLS+5)type="play";drawBlock(sctx,x,y,type)}
  sctx.strokeStyle="#ffffff18";sctx.lineWidth=1;sctx.strokeRect(x,y,tile,tile);
 }
 // road edges + coin locations are painted in dynamic layer
}
function cellCenter(i){return{x:ox+(i%COLS+.5)*tile,y:oy+(Math.floor(i/COLS)+.5)*tile}}
function getMask(cell){let m=cell.mask;for(let k=0;k<cell.rotation;k++)m=rotateMask(m);return m}
function neighbors(i){
 const r=Math.floor(i/COLS),c=i%COLS,m=getMask(cells[i]),out=[];
 const dirs=[[N,-COLS,S],[E,1,WEST],[S,COLS,N],[WEST,-1,E]];
 for(const [bit,delta,opp] of dirs){if(!(m&bit))continue;const j=i+delta;if(j<0||j>=cells.length)continue;if(bit===E&&c===COLS-1||bit===WEST&&c===0)continue;if(getMask(cells[j])&opp)out.push(j)}
 return out;
}
function bfs(){
 const q=[start],prev=new Map([[start,-1]]);
 for(let p=0;p<q.length;p++){const i=q[p];if(i===dest)break;for(const j of neighbors(i))if(!prev.has(j)){prev.set(j,i);q.push(j)}}
 if(!prev.has(dest))return [];
 const path=[];for(let i=dest;i!==-1;i=prev.get(i))path.push(i);return path.reverse();
}
function drawDynamic(){
 if(!W||!H)return;ctx.clearRect(0,0,W,H);
 // coin markers
 cells.forEach((c,i)=>{if(c.coin&&!c.coinTaken){const p=cellCenter(i),rad=tile*.19;ctx.save();ctx.shadowColor="#ffb300";ctx.shadowBlur=8;ctx.fillStyle="#ffb91f";ctx.strokeStyle="#fff1a6";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#8a4c00";ctx.font=`900 ${tile*.22}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",p.x,p.y+1);ctx.restore()}});
 route=bfs();
 if(route.length>1){
  ctx.save();ctx.strokeStyle="#04ed78";ctx.lineWidth=Math.max(4,tile*.095);ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowColor="#00ff82";ctx.shadowBlur=8;ctx.beginPath();
  route.forEach((i,k)=>{const p=cellCenter(i);if(k===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke();ctx.shadowBlur=0;
  const p=cellCenter(route[Math.min(1,route.length-1)]);ctx.fillStyle="#04ed78";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-tile*.17,p.y-tile*.14);ctx.lineTo(p.x-tile*.17,p.y+tile*.14);ctx.closePath();ctx.fill();ctx.restore();
 }
 // destination ring
 const d=cellCenter(dest);ctx.save();ctx.strokeStyle="#04e875";ctx.lineWidth=4;ctx.shadowColor="#00ff80";ctx.shadowBlur=10;ctx.beginPath();ctx.arc(d.x,d.y,tile*.42,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#0a8c58";ctx.beginPath();ctx.arc(d.x,d.y,tile*.25,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font=`900 ${tile*.17}px system-ui`;ctx.textAlign="center";ctx.fillText("⌂",d.x,d.y+tile*.04);ctx.font=`900 ${tile*.12}px system-ui`;ctx.fillText("CLIENTE",d.x,d.y+tile*.39);ctx.restore();
 // rotate affordance for rotatable street cells
 cells.forEach((c,i)=>{if(c.isRoad&&i!==start&&i!==dest){const x=ox+(i%COLS+1)*tile-tile*.15,y=oy+(Math.floor(i/COLS))*tile+tile*.15;ctx.fillStyle="#071525a8";ctx.beginPath();ctx.arc(x,y,tile*.105,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e8f3ff";ctx.font=`${tile*.15}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("↻",x,y)}});
 // vehicles
 const bike=anim?anim.pos:cellCenter(start);
 if(assets.motorcycle?.complete&&assets.motorcycle.naturalWidth){ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(0);ctx.drawImage(assets.motorcycle,-tile*.36,-tile*.2,tile*.72,tile*.4);ctx.restore()}
 // decorative cars
 const carSpots=[cellCenter(8),cellCenter(22),cellCenter(30)];
 carSpots.forEach((p,k)=>{if(assets.car?.complete&&assets.car.naturalWidth)ctx.drawImage(assets.car,p.x-tile*.17,p.y-tile*.28,tile*.34,tile*.56)});
 const steps=route.length>0?route.length-1:0;
 $("stars").textContent=steps?("⭐".repeat(steps<=5?3:steps<=8?2:1)):"";
 $("statusText").textContent=route.length?"Ruta conectada · "+steps+" tramos":"Conecta las calles hasta CLIENTE";
 $("deliver").disabled=route.length<2||!!anim;
}
function rotateCell(i){if(anim||i===start||i===dest||!cells[i].isRoad)return;cells[i].rotation=(cells[i].rotation+1)%4;drawStatic();drawDynamic();if(route.length)showToast("¡Ruta recalculada!");}
function pointToCell(x,y){const c=Math.floor((x-ox)/tile),r=Math.floor((y-oy)/tile);if(c<0||c>=COLS||r<0||r>=ROWS)return -1;return r*COLS+c}
mapCanvas.addEventListener("pointerdown",e=>{const r=mapCanvas.getBoundingClientRect(),i=pointToCell(e.clientX-r.left,e.clientY-r.top);if(i>=0)rotateCell(i)});
function collectCoins(i){const c=cells[i];if(c.coin&&!c.coinTaken){c.coinTaken=true;cash+=5;$("cash").textContent="$"+cash;save();showToast("🪙 +$5 moneda recogida")}}
function deliver(){
 route=bfs();if(route.length<2){showToast("⚠️ La ruta aún no está conectada");return}
 const steps=route.length-1,stars=steps<=5?3:steps<=8?2:1;
 $("deliver").disabled=true;let index=0;const startTime=performance.now(),duration=Math.max(2500,steps*650);
 anim={pos:cellCenter(route[0])};$("statusText").textContent="La moto está en camino…";
 function frame(now){const t=Math.min(1,(now-startTime)/duration),scaled=t*steps;index=Math.min(steps,Math.floor(scaled));const frac=scaled-index;const a=cellCenter(route[index]),b=cellCenter(route[Math.min(index+1,steps)]);anim.pos={x:a.x+(b.x-a.x)*frac,y:a.y+(b.y-a.y)*frac};$("speed").textContent=t<1?"35":"0";
  if(index!==anim.last){collectCoins(route[index]);anim.last=index}
  drawDynamic();if(t<1)requestAnimationFrame(frame);else{anim=null;delivered++;order++;cash+=20*stars;gems+=stars===3?1:0;energy=Math.max(0,energy-1);$("buildings").textContent=delivered;$("orderNo").textContent=order;$("orderLabel").textContent=order;$("cash").textContent="$"+cash;$("gems").textContent=gems;$("energy").textContent=energy;$("speed").textContent="0";$("statusText").textContent=`¡Pedido entregado! ${"⭐".repeat(stars)}`;save();showToast(`¡Entrega completada! +$${20*stars}`);setTimeout(newLevel,1300)}
 }
 requestAnimationFrame(frame);
}
function newLevel(){
 // Reset route puzzle and collected coins while keeping saved progression.
 cells.forEach((c,i)=>{c.coinTaken=false;c.rotation=0});
 cells[3*COLS+2].rotation=1;drawStatic();drawDynamic();timer=40;$("timer").textContent=timer;$("missionText").textContent="Conecta la ruta y entrega el pedido";$("deliver").disabled=true;
}
$("deliver").addEventListener("click",deliver);
$("help").addEventListener("click",()=>{if(energy<=0){showToast("No tienes ayudas disponibles");return}energy--;cells[3*COLS+2].rotation=0;$("energy").textContent=energy;drawStatic();drawDynamic();save();showToast("⚡ Ayuda utilizada: calle orientada")});
$("menu").addEventListener("click",()=>showToast("Delivery Rush · Progreso guardado"));
document.querySelectorAll(".tool").forEach(b=>{if(!["help","menu"].includes(b.id))b.addEventListener("click",()=>showToast(b.title+" próximamente"))});
window.addEventListener("resize",resize);
resize();
if(loaded===assetNames.length)drawStatic();
